<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">

  <title>Mi Agenda · Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      min-height: 100%;
      background: #050505;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #29210d 0%, #111 32%, #050505 72%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .contenedor {
      width: min(92%, 520px);
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-icono {
      width: 76px;
      height: 76px;
      margin: auto;
      border: 1px solid #b98b2d;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 36px;
      background: linear-gradient(145deg, #201a0e, #090909);
      box-shadow: 0 0 35px rgba(212, 168, 67, .15);
    }

    h1 {
      margin: 16px 0 5px;
      font-size: 30px;
    }

    .dorado {
      color: #d7ad4b;
    }

    .subtitulo {
      color: #999;
      font-size: 14px;
    }

    .tarjeta {
      background: rgba(20,20,20,.94);
      border: 1px solid #292929;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 13px;
      border: 1px solid #333;
      background: #090909;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #b98b2d;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #e0b95c, #a97719);
      color: #090909;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button.secundario {
      background: #1a1a1a;
      color: #ddd;
      border: 1px solid #333;
    }

    .mensaje {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .error {
      color: #ff7272;
    }

    .ok {
      color: #72df9b;
    }

    .oculto {
      display: none;
    }

    .cabecera-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .cabecera-panel h2 {
      margin: 0;
    }

    .estado {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      background: #13261a;
      color: #72df9b;
      font-size: 12px;
      font-weight: 700;
    }

    .codigo {
      margin-top: 17px;
      padding: 18px;
      background: #080808;
      border: 1px solid #342a15;
      border-radius: 15px;
      text-align: center;
    }

    .codigo small {
      display: block;
      color: #888;
      margin-bottom: 8px;
    }

    .codigo strong {
      color: #e1b854;
      font-size: 21px;
      letter-spacing: 1px;
      word-break: break-all;
    }

    .nota {
      color: #777;
      font-size: 12px;
      text-align: center;
      margin-top: 22px;
    }

    .acciones-codigo{display:flex;gap:8px;margin-top:14px}.acciones-codigo button{margin:0}
    .titulo-lista{margin:26px 0 10px;color:#e1b854;font-size:18px}.lista-licencias{display:grid;gap:10px;margin-top:12px}
    .licencia-item{padding:14px;background:#080808;border:1px solid #292929;border-radius:14px}
    .lic-top{display:flex;justify-content:space-between;gap:10px}.lic-code{color:#e1b854;font-weight:800;font-size:14px;word-break:break-all}
    .badge{padding:5px 8px;border-radius:12px;font-size:10px;font-weight:800;white-space:nowrap}.badge.on{background:#13261a;color:#72df9b}.badge.off{background:#301717;color:#ff8b8b}
    .lic-meta{color:#777;font-size:11px;margin-top:6px}.lic-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    button.mini{width:auto;margin:0;padding:9px 10px;font-size:11px;border-radius:9px}button.rojo{background:#301717;color:#ff8b8b;border:1px solid #633}button.verde{background:#13261a;color:#72df9b;border:1px solid #28563a}
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="logo">
      <div class="logo-icono">⚡</div>
      <h1>MI AGENDA <span class="dorado">ADMIN</span></h1>
      <div class="subtitulo">Panel privado de administración</div>
    </div>

    <!-- LOGIN -->
    <section id="login" class="tarjeta">

      <label>Correo administrador</label>
      <input
        id="email"
        type="email"
        value="Kichan.iluminador@gmail.com"
        autocomplete="username"
      >

      <label>Contraseña</label>
      <input
        id="password"
        type="password"
        placeholder="Tu contraseña"
        autocomplete="current-password"
      >

      <button id="btnLogin" onclick="iniciarSesion()">
        ENTRAR
      </button>

      <div id="mensajeLogin" class="mensaje"></div>

    </section>


    <!-- PANEL -->
    <section id="panel" class="oculto">

      <div class="tarjeta">

        <div class="cabecera-panel">
          <div>
            <h2>Administrador</h2>
            <div id="correoAdmin" class="subtitulo"></div>
          </div>

          <span class="estado">CONECTADO</span>
        </div>

        <button onclick="generarLicencia()">
          + GENERAR NUEVA LICENCIA
        </button>

        <div id="resultadoLicencia" class="codigo oculto">
          <small>NUEVA LICENCIA</small>
          <strong id="codigoLicencia"></strong>
          <div class="acciones-codigo"><button onclick="copiarNueva()">📋 COPIAR</button><button onclick="compartirNueva()">↗ COMPARTIR</button></div>
        </div>

        <div id="mensajePanel" class="mensaje"></div>

        <h3 class="titulo-lista">LICENCIAS</h3>
        <button class="secundario" onclick="cargarLicencias()">↻ ACTUALIZAR LICENCIAS</button>
        <div id="listaLicencias" class="lista-licencias"></div>
        <button class="secundario" onclick="cerrarSesion()">
          CERRAR SESIÓN
        </button>

      </div>

    </section>

    <div class="nota">
      MI AGENDA · Panel de administración
    </div>

  </main>


<script>
  const SUPABASE_URL =
    "https://neespcclnniuwscpjaon.supabase.co";

  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lZXNwY2Nsbm5pdXdzY3BqYW9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzQ3NTgsImV4cCI6MjEwNTYxMDc1OH0.g3h2gMoLRfpgBLCTEXim84XmiQW3T7TASYCdsgwYFXs";

  const cliente = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  async function iniciarSesion() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const mensaje =
      document.getElementById("mensajeLogin");

    mensaje.className = "mensaje";
    mensaje.textContent = "Ingresando...";

    const { data, error } =
      await cliente.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      mensaje.className = "mensaje error";
      mensaje.textContent =
        "No se pudo iniciar sesión. Revisa correo y contraseña.";
      return;
    }

    mostrarPanel(data.user);
  }


  async function comprobarSesion() {

    const {
      data: { session }
    } = await cliente.auth.getSession();

    if (session?.user) {
      mostrarPanel(session.user);
    }
  }


  function mostrarPanel(user) {

    document.getElementById("login")
      .classList.add("oculto");

    document.getElementById("panel")
      .classList.remove("oculto");

    document.getElementById("correoAdmin")
      .textContent = user.email || "";
    cargarLicencias();
  }


  async function generarLicencia() {

    const mensaje =
      document.getElementById("mensajePanel");

    const caja =
      document.getElementById("resultadoLicencia");

    mensaje.className = "mensaje";
    mensaje.textContent = "Generando licencia...";

    caja.classList.add("oculto");

    const { data, error } =
      await cliente.rpc("generar_codigo_agenda");

    if (error) {
      console.error(error);

      mensaje.className = "mensaje error";
      mensaje.textContent =
        "No se pudo generar la licencia.";
      return;
    }

    let codigo = data;

    if (
      data &&
      typeof data === "object" &&
      !Array.isArray(data)
    ) {
      codigo =
        data.codigo ??
        data.licencia ??
        JSON.stringify(data);
    }

    if (Array.isArray(data)) {
      const primero = data[0];

      codigo =
        primero?.codigo ??
        primero?.licencia ??
        JSON.stringify(primero);
    }

    document.getElementById("codigoLicencia")
      .textContent = codigo ?? "Generada";

    caja.classList.remove("oculto");

    mensaje.className = "mensaje ok";
    mensaje.textContent =
      "Licencia generada correctamente.";
    cargarLicencias();
  }



  function msg(t,c=""){const m=document.getElementById("mensajePanel");m.className="mensaje "+c;m.textContent=t}
  async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}}
  function nueva(){return document.getElementById("codigoLicencia").textContent.trim()}
  async function copiarNueva(){await copyText(nueva());msg("Licencia copiada.","ok")}
  async function compartirNueva(){const c=nueva();if(navigator.share)await navigator.share({title:"Mi Agenda",text:"Tu licencia de MI AGENDA es: "+c});else{await copyText(c);msg("Licencia copiada para compartir.","ok")}}
  function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  async function cargarLicencias(){
    const l=document.getElementById("listaLicencias");if(!l)return;l.innerHTML='<div class="mensaje">Cargando licencias...</div>';
    const {data,error}=await cliente.rpc("listar_licencias_admin");
    if(error){console.error(error);l.innerHTML='<div class="mensaje error">No se pudieron cargar las licencias.</div>';return}
    if(!data?.length){l.innerHTML='<div class="mensaje">No hay licencias.</div>';return}
    l.innerHTML=data.map(x=>`<div class="licencia-item"><div class="lic-top"><div class="lic-code">${esc(x.codigo)}</div><span class="badge ${x.activa?"on":"off"}">${x.activa?"ACTIVA":"DESACTIVADA"}</span></div><div class="lic-meta">${x.dispositivo_id?"Vinculada a un dispositivo":"Sin dispositivo vinculado"}</div><div class="lic-actions"><button class="mini" onclick='copiarLicencia(${JSON.stringify(x.codigo)})'>📋 COPIAR</button><button class="mini" onclick='compartirLicencia(${JSON.stringify(x.codigo)})'>↗ COMPARTIR</button><button class="mini ${x.activa?"rojo":"verde"}" onclick='cambiarEstado(${JSON.stringify(x.codigo)},${!x.activa})'>${x.activa?"DESACTIVAR":"ACTIVAR"}</button>${x.dispositivo_id?`<button class="mini secundario" onclick='liberarDispositivo(${JSON.stringify(x.codigo)})'>🔓 LIBERAR</button>`:""}</div></div>`).join("")
  }
  async function copiarLicencia(c){await copyText(c);msg("Licencia copiada.","ok")}
  async function compartirLicencia(c){if(navigator.share)await navigator.share({title:"Mi Agenda",text:"Tu licencia de MI AGENDA es: "+c});else{await copyText(c);msg("Licencia copiada para compartir.","ok")}}
  async function cambiarEstado(c,a){if(!confirm((a?"¿Activar ":"¿Desactivar ")+c+"?"))return;const {error}=await cliente.from("licencias").update({activa:a}).eq("codigo",c);if(error){console.error(error);msg("No se pudo cambiar el estado.","error");return}msg(a?"Licencia activada.":"Licencia desactivada.","ok");cargarLicencias()}
  async function liberarDispositivo(c){if(!confirm("¿Liberar esta licencia del dispositivo actual? Podrá activarse en otro dispositivo."))return;const {error}=await cliente.from("licencias").update({dispositivo_id:null}).eq("codigo",c);if(error){console.error(error);msg("No se pudo liberar el dispositivo.","error");return}msg("Licencia liberada del dispositivo.","ok");cargarLicencias()}

  async function cerrarSesion() {

    await cliente.auth.signOut();

    document.getElementById("panel")
      .classList.add("oculto");

    document.getElementById("login")
      .classList.remove("oculto");

    document.getElementById("password").value = "";
    document.getElementById("mensajeLogin").textContent = "";
  }


  comprobarSesion();
</script>

</body>
</html>
