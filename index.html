<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090909">

  <title>Mi Agenda · Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #29210d 0%, #111 32%, #050505 72%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .contenedor {
      width: min(92%, 520px);
      margin: 0 auto;
      padding: 55px 0 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-icono {
      width: 76px;
      height: 76px;
      margin: auto;
      border: 1px solid #b98b2d;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 36px;
      background: linear-gradient(145deg, #201a0e, #090909);
      box-shadow: 0 0 35px rgba(212, 168, 67, .15);
    }

    h1 {
      margin: 16px 0 5px;
      font-size: 30px;
    }

    .dorado {
      color: #d7ad4b;
    }

    .subtitulo {
      color: #999;
      font-size: 14px;
    }

    .tarjeta {
      background: rgba(20,20,20,.94);
      border: 1px solid #292929;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: 13px;
      border: 1px solid #333;
      background: #090909;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #b98b2d;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #e0b95c, #a97719);
      color: #090909;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button.secundario {
      background: #1a1a1a;
      color: #ddd;
      border: 1px solid #333;
    }

    .mensaje {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .error {
      color: #ff7272;
    }

    .ok {
      color: #72df9b;
    }

    .oculto {
      display: none;
    }

    .cabecera-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .cabecera-panel h2 {
      margin: 0;
    }

    .estado {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      background: #13261a;
      color: #72df9b;
      font-size: 12px;
      font-weight: 700;
    }

    .codigo {
      margin-top: 17px;
      padding: 18px;
      background: #080808;
      border: 1px solid #342a15;
      border-radius: 15px;
      text-align: center;
    }

    .codigo small {
      display: block;
      color: #888;
      margin-bottom: 8px;
    }

    .codigo strong {
      color: #e1b854;
      font-size: 21px;
      letter-spacing: 1px;
      word-break: break-all;
    }

    .nota {
      color: #777;
      font-size: 12px;
      text-align: center;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="logo">
      <div class="logo-icono">⚡</div>
      <h1>MI AGENDA <span class="dorado">ADMIN</span></h1>
      <div class="subtitulo">Panel privado de administración</div>
    </div>

    <!-- LOGIN -->
    <section id="login" class="tarjeta">

      <label>Correo administrador</label>
      <input
        id="email"
        type="email"
        value="Kichan.iluminador@gmail.com"
        autocomplete="username"
      >

      <label>Contraseña</label>
      <input
        id="password"
        type="password"
        placeholder="Tu contraseña"
        autocomplete="current-password"
      >

      <button id="btnLogin" onclick="iniciarSesion()">
        ENTRAR
      </button>

      <div id="mensajeLogin" class="mensaje"></div>

    </section>


    <!-- PANEL -->
    <section id="panel" class="oculto">

      <div class="tarjeta">

        <div class="cabecera-panel">
          <div>
            <h2>Administrador</h2>
            <div id="correoAdmin" class="subtitulo"></div>
          </div>

          <span class="estado">CONECTADO</span>
        </div>

        <button onclick="generarLicencia()">
          + GENERAR NUEVA LICENCIA
        </button>

        <div id="resultadoLicencia" class="codigo oculto">
          <small>NUEVA LICENCIA</small>
          <strong id="codigoLicencia"></strong>
        </div>

        <div id="mensajePanel" class="mensaje"></div>

        <button class="secundario" onclick="cerrarSesion()">
          CERRAR SESIÓN
        </button>

      </div>

    </section>

    <div class="nota">
      MI AGENDA · Panel de administración
    </div>

  </main>


<script>
  const SUPABASE_URL =
    "https://neespcclnniuwscpjaon.supabase.co";

  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lZXNwY2Nsbm5pdXdzY3BqYW9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzQ3NTgsImV4cCI6MjEwNTYxMDc1OH0.g3h2gMoLRfpgBLCTEXim84XmiQW3T7TASYCdsgwYFXs";

  const cliente = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  async function iniciarSesion() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const mensaje =
      document.getElementById("mensajeLogin");

    mensaje.className = "mensaje";
    mensaje.textContent = "Ingresando...";

    const { data, error } =
      await cliente.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      mensaje.className = "mensaje error";
      mensaje.textContent =
        "No se pudo iniciar sesión. Revisa correo y contraseña.";
      return;
    }

    mostrarPanel(data.user);
  }


  async function comprobarSesion() {

    const {
      data: { session }
    } = await cliente.auth.getSession();

    if (session?.user) {
      mostrarPanel(session.user);
    }
  }


  function mostrarPanel(user) {

    document.getElementById("login")
      .classList.add("oculto");

    document.getElementById("panel")
      .classList.remove("oculto");

    document.getElementById("correoAdmin")
      .textContent = user.email || "";
  }


  async function generarLicencia() {

    const mensaje =
      document.getElementById("mensajePanel");

    const caja =
      document.getElementById("resultadoLicencia");

    mensaje.className = "mensaje";
    mensaje.textContent = "Generando licencia...";

    caja.classList.add("oculto");

    const { data, error } =
      await cliente.rpc("generar_codigo_agenda");

    if (error) {
      console.error(error);

      mensaje.className = "mensaje error";
      mensaje.textContent =
        "No se pudo generar la licencia.";
      return;
    }

    let codigo = data;

    if (
      data &&
      typeof data === "object" &&
      !Array.isArray(data)
    ) {
      codigo =
        data.codigo ??
        data.licencia ??
        JSON.stringify(data);
    }

    if (Array.isArray(data)) {
      const primero = data[0];

      codigo =
        primero?.codigo ??
        primero?.licencia ??
        JSON.stringify(primero);
    }

    document.getElementById("codigoLicencia")
      .textContent = codigo ?? "Generada";

    caja.classList.remove("oculto");

    mensaje.className = "mensaje ok";
    mensaje.textContent =
      "Licencia generada correctamente.";
  }


  async function cerrarSesion() {

    await cliente.auth.signOut();

    document.getElementById("panel")
      .classList.add("oculto");

    document.getElementById("login")
      .classList.remove("oculto");

    document.getElementById("password").value = "";
    document.getElementById("mensajeLogin").textContent = "";
  }


  comprobarSesion();
</script>

</body>
</html>
